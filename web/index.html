<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Таблица Менделеева">
    <title>Таблица Менделеева</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="table">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                </svg>
                <span>Таблица</span>
            </button>
            <button class="nav-btn" data-view="search">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <span>Поиск</span>
            </button>
            <button class="nav-btn" data-view="quiz">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <span>Викторина</span>
            </button>
        </nav>

        <!-- Table View -->
        <div id="table-view" class="view active">
            <header>
                <h1>Таблица Менделеева</h1>
            </header>
            <div class="table-container">
                <div id="periodic-table"></div>
            </div>
        </div>

        <!-- Search View -->
        <div id="search-view" class="view">
            <header>
                <h1>Поиск</h1>
            </header>
            <div class="search-container">
                <div class="search-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="search-input" placeholder="Поиск по названию, символу или номеру">
                </div>
                <div class="filter-container">
                    <button id="filter-btn" class="filter-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                        </svg>
                        <span id="filter-text">Все категории</span>
                    </button>
                </div>
                <div id="search-results" class="search-results"></div>
            </div>
        </div>

        <!-- Quiz View -->
        <div id="quiz-view" class="view">
            <header>
                <h1>Викторина</h1>
            </header>
            <div id="quiz-container" class="quiz-container"></div>
        </div>

        <!-- Element Detail Modal -->
        <div id="element-modal" class="modal">
            <div class="modal-content">
                <button class="modal-close">&times;</button>
                <div id="element-detail"></div>
            </div>
        </div>

        <!-- Filter Modal -->
        <div id="filter-modal" class="modal">
            <div class="modal-content">
                <button class="modal-close">&times;</button>
                <h2>Фильтр по категории</h2>
                <div id="filter-options"></div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
