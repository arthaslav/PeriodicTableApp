name: iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Create Xcode project
      run: |
        # Create project directory structure
        mkdir -p PeriodicTableApp.xcodeproj
        
        # Create project.pbxproj
        cat > PeriodicTableApp.xcodeproj/project.pbxproj << 'EOF'
        // !$*UTF8*$!
        {
        	archiveVersion = 1;
        	classes = {
        	};
        	objectVersion = 55;
        	objects = {
        		/* Begin PBXBuildFile section */
        		A1000001 /* PeriodicTableApp.swift in Sources */ = {isa = PBXBuildFile; fileRef = B1000001; };
        		A1000002 /* ContentView.swift in Sources */ = {isa = PBXBuildFile; fileRef = B1000002; };
        		A1000003 /* Element.swift in Sources */ = {isa = PBXBuildFile; fileRef = B1000003; };
        		A1000004 /* ElementDetailView.swift in Sources */ = {isa = PBXBuildFile; fileRef = B1000004; };
        		A1000005 /* SearchView.swift in Sources */ = {isa = PBXBuildFile; fileRef = B1000005; };
        		A1000006 /* QuizView.swift in Sources */ = {isa = PBXBuildFile; fileRef = B1000006; };
        		A1000007 /* QuizManager.swift in Sources */ = {isa = PBXBuildFile; fileRef = B1000007; };
        		A1000008 /* Theme.swift in Sources */ = {isa = PBXBuildFile; fileRef = B1000008; };
