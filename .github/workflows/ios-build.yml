    - name: Build iOS app
      run: |
        xcodebuild -project PeriodicTableApp.xcodeproj \
                   -scheme PeriodicTableApp \
                   -sdk iphonesimulator \
                   -destination 'platform=iOS Simulator,name=iPhone 16,OS=26.2' \
                   clean build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO
    
    - name: Build success
      run: echo "✅ iOS app built successfully!"
