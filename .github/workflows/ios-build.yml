        			attributes = {
        				BuildIndependentTargetsInParallel = 1;
        				LastSwiftUpdateCheck = 1400;
        				LastUpgradeCheck = 1400;
        			};
        			buildConfigurationList = H1000002 /* Build configuration list for PBXProject "PeriodicTableApp" */;
        			compatibilityVersion = "Xcode 13.0";
        			developmentRegion = en;
        			hasScannedForEncodings = 0;
        			knownRegions = (
        				en,
        				Base,
        			);
        			mainGroup = E1000001;
        			productRefGroup = E1000003 /* Products */;
        			projectDirPath = "";
        			projectRoot = "";
        			targets = (
        				F1000001 /* PeriodicTableApp */,
        			);
        		};
        		/* End PBXProject section */
        		
        		/* Begin PBXSourcesBuildPhase section */
        		G1000001 /* Sources */ = {
        			isa = PBXSourcesBuildPhase;
        			buildActionMask = 2147483647;
        			files = (
        				A1000001 /* PeriodicTableApp.swift in Sources */,
        				A1000002 /* ContentView.swift in Sources */,
        				A1000003 /* Element.swift in Sources */,
        				A1000004 /* ElementDetailView.swift in Sources */,
        				A1000005 /* SearchView.swift in Sources */,
        				A1000006 /* QuizView.swift in Sources */,
        				A1000007 /* QuizManager.swift in Sources */,
        				A1000008 /* Theme.swift in Sources */,
