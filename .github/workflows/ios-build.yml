        			);
        			name = Products;
        			sourceTree = "<group>";
        		};
        		/* End PBXGroup section */
        		
        		/* Begin PBXNativeTarget section */
        		F1000001 /* PeriodicTableApp */ = {
        			isa = PBXNativeTarget;
        			buildConfigurationList = F1000002 /* Build configuration list for PBXNativeTarget "PeriodicTableApp" */;
        			buildPhases = (
        				D1000001 /* Frameworks */,
        				G1000001 /* Sources */,
